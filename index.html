<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘 뭐 먹지? | 랜덤 메뉴 추천</title>
  <meta name="description" content="결정 장애를 날려줄 오늘의 랜덤 메뉴 추천 서비스! 한식, 중식, 일식, 양식 중 최고의 메뉴를 추천해 드립니다.">
  
  <!-- Pretendard Font -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient background glow elements -->
  <div class="bg-glow glow-1"></div>
  <div class="bg-glow glow-2"></div>
  <div class="bg-glow glow-3"></div>

  <main class="app-container">
    <!-- Header Section -->
    <header class="header">
      <div class="header-badge">
        <span class="badge-dot"></span>
        <span>고민되는 식사 시간 해결사</span>
      </div>
      <h1 class="main-title">오늘 뭐 먹지?</h1>
      <p class="sub-title">결정 장애를 한 방에 해결해 드려요! 카테고리를 고르고 버튼을 눌러보세요.</p>
    </header>

    <!-- Category Filter Tabs -->
    <section class="category-section" aria-label="메뉴 카테고리 선택">
      <div class="category-tabs" id="categoryTabs" role="tablist">
        <button class="category-btn active" data-category="all" role="tab" aria-selected="true" id="tab-all">
          <span class="cat-icon">✨</span> 전체
        </button>
        <button class="category-btn" data-category="korean" role="tab" aria-selected="false" id="tab-korean">
          <span class="cat-icon">🍚</span> 한식
        </button>
        <button class="category-btn" data-category="chinese" role="tab" aria-selected="false" id="tab-chinese">
          <span class="cat-icon">🥟</span> 중식
        </button>
        <button class="category-btn" data-category="japanese" role="tab" aria-selected="false" id="tab-japanese">
          <span class="cat-icon">🍣</span> 일식
        </button>
        <button class="category-btn" data-category="western" role="tab" aria-selected="false" id="tab-western">
          <span class="cat-icon">🍕</span> 양식
        </button>
        <button class="category-btn" data-category="snack" role="tab" aria-selected="false" id="tab-snack">
          <span class="cat-icon">🍜</span> 분식·아시안
        </button>
      </div>
    </section>

    <!-- Main Recommendation Card -->
    <section class="card-section">
      <div class="recommend-card" id="recommendCard">
        <!-- Visual Food Showcase Area -->
        <div class="card-content" id="cardContent">
          <div class="menu-visual-container" id="menuVisualContainer">
            <div class="menu-image-frame" id="menuImageFrame">
              <img src="assets/hero_cover.jpg" alt="음식 비주얼" class="menu-image" id="menuImage" loading="eager" />
              <div class="image-overlay"></div>
              <span class="menu-badge-floating" id="menuTag">✨ 추천 대기 중</span>
            </div>
          </div>

          <h2 class="menu-name" id="menuName">메뉴 추천을 받아보세요!</h2>
          <p class="menu-desc" id="menuDesc">아래의 '메뉴 추천하기' 버튼을 누르면 딱 맞는 메뉴를 골라드려요.</p>

          <!-- Quick Action Buttons for selected menu -->
          <div class="action-links hidden" id="actionLinks">
            <a href="#" target="_blank" rel="noopener noreferrer" class="map-link naver" id="naverMapLink" title="네이버 지도에서 주변 맛집 찾기">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                <path d="M16.273 12.845L7.376 0H0v24h7.727V11.155L16.624 24H24V0h-7.727z"/>
              </svg>
              <span>주변 맛집 검색</span>
            </a>
            <button class="share-btn" id="shareBtn" title="메뉴 복사하기">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
                <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
              </svg>
              <span>공유</span>
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- Recommendation Trigger Button -->
    <section class="action-section">
      <button class="primary-btn" id="recommendBtn" aria-label="메뉴 추천하기">
        <span class="btn-shine"></span>
        <span class="btn-icon">🎲</span>
        <span class="btn-text">메뉴 추천하기</span>
      </button>

      <div class="sound-toggle-wrapper">
        <label class="sound-toggle-label" for="soundToggle">
          <input type="checkbox" id="soundToggle" checked>
          <span class="sound-toggle-slider"></span>
          <span class="sound-label-text">효과음 켜기</span>
        </label>
      </div>
    </section>

    <!-- Recent History Section -->
    <section class="history-section hidden" id="historySection">
      <div class="history-header">
        <h3 class="history-title">최근 추천 기록</h3>
        <button class="history-clear-btn" id="clearHistoryBtn" title="기록 지우기">지우기</button>
      </div>
      <div class="history-chips" id="historyChips"></div>
    </section>

    <!-- Toast Notification -->
    <div class="toast" id="toast" role="status" aria-live="polite">클립보드에 복사되었습니다!</div>
  </main>

  <footer class="footer">
    <p>© 오늘 뭐 먹지? • 취향대로 맛있게 드세요!</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
